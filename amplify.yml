version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npm run setup:psychojs
        - npm run examples
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .
    files:
      - 'index.html'
      - 'examples/index.html'
      - 'coi-serviceworker.js'
      - 'first.js'
      - 'threshold.js'
      - 'experimentLanguage.js'
      - 'conditions/**/*'
      - 'js/**/*'
      - 'components/**/*'
      - 'parameters/**/*'
      - 'models/**/*'
      - 'examples/generated/**/*'
  cache:
    paths:
      - node_modules/**/*
      - psychojs/node_modules/**/*
  customRules:
    - source: /^https?:\\/\\/(?!www\\.)?[^/]+\\.(easyeyes\\.app|easyeyes\\.com|easyeyes\\.io)\\/?.*$/
      target: /index.html
      status: 200
      condition: null
    - source: /\\[^.]*$/
      target: /index.html
      status: 200
      condition: null